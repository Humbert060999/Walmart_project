[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "walmart_sales_forecast"
version = "0.0.1"
description = "Walmart sales forecast"
authors = [
  { name = "Grupo 5" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["walmart_sales_forecast"]
include = ["pyproject.toml", "walmart_sales_forecast/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["walmart_sales_forecast"]
force-sort-within-sections = true

